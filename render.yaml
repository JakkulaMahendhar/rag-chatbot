# Render Blueprint - deploys the app as a Docker web service against a
# managed free-tier Postgres. See README.md "Sprint 12" for full context,
# including the free-tier tradeoff: no persistent disk on the free plan,
# so uploaded documents / vector index / BM25 index do not survive a
# redeploy or a scale-to-zero cold start. Upgrade both plans below to a
# paid tier + attach a disk when that matters.

databases:
  - name: rag-chatbot-db
    plan: free
    databaseName: rag_chatbot
    user: rag_user

services:
  - type: web
    name: rag-chatbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Render's Postgres connection string has no SQLAlchemy driver
      # suffix; entrypoint.sh derives DATABASE_URL/DATABASE_URL_SYNC
      # from this at container startup.
      - key: DATABASE_CONNECTION_STRING
        fromDatabase:
          name: rag-chatbot-db
          property: connectionString

      # Secrets - not stored in this file. Render will prompt for these
      # in the dashboard on first deploy.
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Ollama needs a locally reachable daemon, which doesn't exist on
      # Render - Gemini is the only LLM_PROVIDER option that works here.
      - key: LLM_PROVIDER
        value: gemini

      # The free/Starter plans cap out at 512MB RAM, and PyTorch's
      # multi-threaded buffer allocation can meaningfully add to its
      # baseline memory footprint. Capped here only (not in
      # docker-compose.yml/.env.example) - local dev has more cores and
      # no memory ceiling, so there's no reason to slow it down there.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"

      # Every other setting (embedding model, chunk size, retrieval
      # thresholds, CORS, rate limiting, etc.) already has a sensible
      # default in app/core/config.py and doesn't need to be repeated
      # here. Add an entry above only to override one of those defaults
      # for this deployment specifically.

  # Background worker: picks up documents left in status="pending" by
  # POST /upload and runs the actual parse/chunk/embed/index pipeline,
  # so the web service never has to hold that work (or its PyTorch
  # memory footprint) during an HTTP request. Same Dockerfile and
  # image as the web service, different start command.
  #
  # IMPORTANT - plan choice below is a placeholder, not a
  # recommendation: Render has no free tier for background workers
  # (Starter, $7/mo, is the minimum). Starter is *also* capped at
  # 512MB RAM - the same ceiling that caused the original OOM - so
  # Starter alone does not fix that, it only isolates it to this
  # service instead of the web one. To actually fix it, either bump
  # this to `plan: standard` ($25/mo, 2GB RAM) or pair this worker
  # with a lighter/hosted embedding approach that doesn't need
  # PyTorch. Decide before deploying this service.
  - type: worker
    name: rag-chatbot-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: ./worker_entrypoint.sh
    plan: starter
    envVars:
      - key: DATABASE_CONNECTION_STRING
        fromDatabase:
          name: rag-chatbot-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"

  # Frontend - a plain static export (see frontend/next.config.ts), not
  # a Node web service: the app has no server-only features (no API
  # routes, no server actions, no next/image), so there's nothing that
  # actually needs a running server. Free to host as a static site.
  #
  # NEXT_PUBLIC_API_URL isn't declared here - Next.js inlines
  # NEXT_PUBLIC_ vars into the client bundle at `next build` time, and
  # whether Render exposes Blueprint envVars during a static site's
  # build step specifically isn't documented. frontend/.env.production
  # is committed (it's a public URL, not a secret) so the build works
  # the same regardless of that platform detail.
  - type: web
    name: rag-chatbot-frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
